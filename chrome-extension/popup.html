<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOJO Analytics Helper</title>
  <style>
    body {
      width: 100%;
      max-height: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      background-color: #f9fafb;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    
    header {
      background-color: #4f46e5;
      color: white;
      padding: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    h1 { font-size: 1.125rem; font-weight: bold; margin: 0; }
    #clear-btn {
      background-color: #6366f1; color: white; border: none; padding: 4px 8px; font-size: 0.75rem; border-radius: 4px; cursor: pointer;
    }
    #clear-btn:hover { background-color: #818cf8; }
    
    #filter-bar {
      background: white; border-bottom: 1px solid #e5e7eb; padding: 12px 16px;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 0.75rem;
      position: sticky; top: 60px; z-index: 9;
    }
    #filter-bar span { font-weight: 600; color: #374151; margin-right: 4px; }
    #filter-bar label { display: flex; align-items: center; gap: 4px; cursor: pointer; color: #4b5563; }
    
    #events-container {
      flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px;
    }
    #empty-state { text-align: center; color: #6b7280; margin-top: 40px; }
    
    .event-card {
      background: white; border: 1px solid #e5e7eb; border-radius: 8px; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05); cursor: pointer; overflow: hidden; flex-shrink: 0;
    }
    .event-card:hover { box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .event-header { padding: 12px; border-bottom: 1px solid #f3f4f6; }
    .event-name { font-weight: 600; color: #1f2937; margin-bottom: 4px; word-break: break-all; }
    .event-time { font-size: 0.75rem; color: #9ca3af; }
    .providers-container { padding: 8px 12px; background: #f9fafb; display: flex; flex-wrap: wrap; gap: 4px; }
    .event-payload { 
      border-top: 1px solid #f3f4f6; 
      background: #1f2937; 
      color: #4ade80; 
      padding: 12px; 
      font-size: 0.75rem; 
      overflow: auto; 
      max-height: 300px; 
      display: none; 
    }
    
    /* Dynamic Badge Classes */
    .badge { font-size: 10px; padding: 2px 8px; border-radius: 4px; border: 1px solid; font-weight: 500; }
    .badge-clevertap { background: #ffedd5; color: #9a3412; border-color: #fed7aa; }
    .badge-firebase { background: #fef9c3; color: #854d0e; border-color: #fef08a; }
    .badge-backend { background: #f3e8ff; color: #6b21a8; border-color: #e9d5ff; }
    .badge-meta_pixel { background: #dbeafe; color: #1e40af; border-color: #bfdbfe; }
    .badge-google_tag { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
    .badge-default { background: #f3f4f6; color: #1f2937; border-color: #e5e7eb; }
  </style>
</head>
<body>
  
  <header>
    <h1>JOJO Analytics Helper</h1>
    <button id="clear-btn">Clear</button>
  </header>

  <div id="filter-bar">
    <span>Filter:</span>
    <label><input type="checkbox" value="clevertap" checked> Clevertap</label>
    <label><input type="checkbox" value="firebase" checked> Firebase</label>
    <label><input type="checkbox" value="backend" checked> Backend</label>
    <label><input type="checkbox" value="meta_pixel" checked> Meta Pixel</label>
    <label><input type="checkbox" value="google_tag" checked> Google Tag</label>
  </div>

  <div id="events-container">
    <div id="empty-state">
      <p>Waiting for analytics events...</p>
    </div>
  </div>

  <template id="event-template">
    <div class="event-card">
      <div class="event-header">
        <div class="event-name"></div>
        <div class="event-time"></div>
      </div>
      <div class="providers-container"></div>
      <div class="event-payload">
        <pre style="margin: 0;"></pre>
      </div>
    </div>
  </template>

  <script src="popup.js"></script>
</body>
</html>
