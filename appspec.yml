version: 0.0
os: linux

file_exists_behavior: OVERWRITE

files:
  - source: /
    destination: /var/www/jojowebv2

permissions:
  - object: /var/www/jojowebv2
    pattern: "**"
    owner: ec2-user
    group: ec2-user
    mode: 755
    type:
      - file
      - directory

hooks:

  ApplicationStop:
    - location: scripts/pm2-stop.sh
      timeout: 300
      runas: ec2-user

  BeforeInstall:
    - location: scripts/cleanup.sh
      timeout: 300
      runas: ec2-user

  AfterInstall:
    - location: scripts/build.sh
      timeout: 1800
      runas: ec2-user

  ApplicationStart:
    - location: scripts/pm2-start.sh
      timeout: 300
      runas: ec2-user
